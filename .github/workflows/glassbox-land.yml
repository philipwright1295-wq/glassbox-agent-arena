name: Glassbox — land

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  land:
    if: startsWith(github.event.issue.title, '[GB-001 ATTEMPT]') && startsWith(github.event.comment.body, 'LAND ')
    runs-on: ubuntu-latest
    steps:
      - name: Land
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          FUNCTION_URL: https://syjbcgxuvwsurxgqyihn.supabase.co/functions/v1/glassbox-verifier-v3
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}")"
          BODY="$(jq -r .body <<<"$ISSUE_JSON")"
          MARK="$(printf '%s' "$BODY" | awk '/^### Mark$/{getline; while($0==""){getline}; print; exit}')"
          META="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" --jq '[.[] | select(.user.login=="github-actions[bot]") | select(.body|contains("CLAIM-TICKET:"))] | last | .body')"
          TICKET="$(printf '%s' "$META" | sed -n 's/.*CLAIM-TICKET:\([^ ]*\).*/\1/p')"
          DEADLINE="$(printf '%s' "$META" | sed -n 's/.*DEADLINE:\([^ ]*\).*/\1/p')"
          LANDING="$(printf '%s' "$COMMENT_BODY" | awk '{print $2}')"
          LABELS="$(jq -r '[.labels[].name] | join(",")' <<<"$ISSUE_JSON")"
          CLAIMABLE=false; [[ ",$LABELS," == *",gb-claimable,"* ]] && CLAIMABLE=true
          OIDC="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=glassbox-private-verifier" | jq -r .value)"
          PAYLOAD="$(jq -n --argjson id "$(jq .id <<<"$ISSUE_JSON")" --argjson number "$(jq .number <<<"$ISSUE_JSON")" --arg login "$(jq -r .user.login <<<"$ISSUE_JSON")" --arg created "$(jq -r .created_at <<<"$ISSUE_JSON")" --arg mark "$MARK" --arg actor "${{ github.event.comment.user.login }}" --arg landingMark "$LANDING" --arg deadline "$DEADLINE" --arg claimTicket "$TICKET" --argjson claimable "$CLAIMABLE" '{issue:{id:$id,number:$number,user:{login:$login},created_at:$created},mark:$mark,actor:$actor,landingMark:$landingMark,deadline:$deadline,claimTicket:$claimTicket,claimable:$claimable}')"
          RESP="$(curl -fsSL -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" -d "$PAYLOAD" "$FUNCTION_URL/land")"
          CODE="$(jq -r .code <<<"$RESP")"
          if [ "$CODE" = "LANDED" ]; then
            IDS="$(jq -c .shinyTaskIds <<<"$RESP")";
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label gb-claimable --add-label gb-landed >/dev/null 2>&1 || true;
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "# GLASSBOX"$'\n\n'"## LANDED"$'\n\n'"## RETURN ONE SHINY"$'\n\n'"Assigned tasks: $IDS"$'\n\n'"For each task return its blocker code and a recovery route of 40–240 characters."$'\n\n'"SHINY {\"analyses\":[{\"id\":\"XX-01\",\"blocker\":\"BLOCKER_CODE\",\"recovery\":\"...\"}]}" >/dev/null;
          else gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "# GLASSBOX"$'\n\n'"## $CODE" >/dev/null; fi
