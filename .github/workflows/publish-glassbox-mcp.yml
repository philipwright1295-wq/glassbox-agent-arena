name: Publish Glassbox MCP listing
on:
  push:
    branches: [nest-mcp-integration]
    paths: [.github/workflows/publish-glassbox-mcp.yml, mcp/server.json]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install publisher
        run: |
          curl --fail --location --silent --show-error "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate listing
        run: ./mcp-publisher validate mcp/server.json
      - name: Authenticate through GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish remote MCP listing
        run: ./mcp-publisher publish mcp/server.json
